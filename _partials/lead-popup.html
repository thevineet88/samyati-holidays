<!-- Lead Capture Popup -->
<style>
  /* Layout */
  #lead-popup .lp-branding  { flex: 1 1 100%; max-width: 100%; }
  #lead-popup .lp-form     { flex: 1 1 100%; max-width: 100%; }
  @media (min-width: 768px) {
    #lead-popup .lp-branding  { flex: 0 0 40%; max-width: 40%; }
    #lead-popup .lp-form     { flex: 0 0 60%; max-width: 60%; }
  }
  @media (max-width: 767px) {
    #lead-popup-panel {
      flex-direction: column !important;
      max-width: 100% !important;
      max-height: 95vh !important;
      border-radius: 1rem !important;
    }
    #lead-popup .lp-branding {
      flex: 0 0 auto !important;
      max-width: 100% !important;
      min-height: auto !important;
      padding: 1.25rem !important;
    }
    #lead-popup .lp-branding h3 {
      font-size: 1rem !important;
    }
    #lead-popup .lp-branding p {
      font-size: 0.75rem !important;
      max-width: 100% !important;
    }
    #lead-popup .lp-branding img[alt="Samyati Holidays"] {
      height: 2rem !important;
      margin-bottom: 0.5rem !important;
    }
    #lead-popup .lp-form {
      flex: 1 1 auto !important;
      max-width: 100% !important;
      overflow-y: auto !important;
      -webkit-overflow-scrolling: touch;
    }
    #lead-popup .lp-form h4 {
      font-size: 1rem !important;
    }
    #lead-popup .lp-form p {
      font-size: 0.75rem !important;
      margin-bottom: 0.75rem !important;
    }
    #lead-popup .lp-form input,
    #lead-popup .lp-form button {
      font-size: 0.875rem !important;
      padding: 0.5rem 0.75rem !important;
    }
  }
  /* Visibility & Animation */
  #lead-popup.hidden { display: none !important; }
  .animate-popup-in {
    animation: popupIn 0.35s ease-out;
  }
  @keyframes popupIn {
    from { opacity: 0; transform: scale(0.92) translateY(16px); }
    to   { opacity: 1; transform: scale(1) translateY(0); }
  }
  body.popup-open { overflow: hidden; }
  /* Feedback messages */
  #lead-popup .form-success {
    padding: 0.75rem 1rem;
    background: #f0fdf4;
    color: #166534;
    border-radius: 0.5rem;
    font-size: 0.875rem;
  }
  #lead-popup .form-error {
    padding: 0.75rem 1rem;
    background: #fef2f2;
    color: #991b1b;
    border-radius: 0.5rem;
    font-size: 0.875rem;
  }
</style>
<div id="lead-popup" class="hidden" role="dialog" aria-modal="true" aria-labelledby="lead-popup-title">
  <!-- Backdrop (no click-to-close — only the X button closes) -->
  <div id="lead-popup-backdrop" class="fixed inset-0 bg-black/60 backdrop-blur-sm z-[200] flex items-center justify-center p-4">
    <div id="lead-popup-panel" class="bg-white rounded-2xl shadow-2xl overflow-hidden w-full max-w-3xl max-h-[90vh] flex flex-col md:flex-row relative animate-popup-in">

      <!-- Close button -->
      <button id="lead-popup-close" class="absolute top-3 right-3 z-10 w-8 h-8 flex items-center justify-center rounded-full bg-white/80 hover:bg-white text-navy hover:text-orange transition-colors" aria-label="Close">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M6 18L18 6M6 6l12 12"/>
        </svg>
      </button>

      <!-- Left side — Branding (40% on desktop, banner on mobile) -->
      <div class="bg-navy text-white relative overflow-hidden lp-branding" style="min-height:200px">
        <!-- Full-bleed background image -->
        <img
          src="assets/munnar_tree.webp"
          alt=""
          class="absolute inset-0 w-full h-full object-cover opacity-25 pointer-events-none"
          aria-hidden="true"
        />
        <!-- Dark overlay for text readability -->
        <div class="absolute inset-0 bg-navy/70"></div>
        <!-- Content -->
        <div class="relative z-10 flex flex-col items-center justify-center text-center p-6 md:p-8 h-full min-h-[200px]">
          <!-- Logo -->
          <img
            src="assets/samyati-logo-cropped.png"
            alt="Samyati Holidays"
            class="h-12 md:h-14 w-auto mb-4 opacity-90"
            onerror="this.style.display='none'"
          />
          <h3 class="font-poppins font-bold text-lg md:text-xl mb-2 leading-tight">Feeling फॅमिली वाली!</h3>
          <p class="text-white/80 text-xs md:text-sm leading-relaxed max-w-[220px]">
            Explore our handpicked group tours and start planning your next unforgettable journey.
          </p>
        </div>
      </div>

      <!-- Right side — Enquiry Form (60%) -->
      <div class="p-6 md:p-8 lp-form overflow-y-auto">
        <h4 id="lead-popup-title" class="font-poppins font-bold text-navy text-lg mb-1">Let's Plan Your Trip!</h4>
        <p class="text-muted text-sm mb-5">Fill in your details and we'll get back to you within 24 hours.</p>

        <div class="form-success mb-3" style="display:none" id="lead-popup-success">
          Thank you! We'll reach out shortly.
        </div>
        <div class="form-error mb-3" style="display:none" id="lead-popup-error">
          Something went wrong. Please WhatsApp us directly.
        </div>

        <form
          action="https://formspree.io/f/xnjelqae"
          method="POST"
          data-async
          class="space-y-3"
          id="lead-popup-form"
        >
          <input type="hidden" name="source" value="popup-enquiry" />
          <div>
            <label for="lp-name" class="form-label">Your Name</label>
            <input
              type="text"
              id="lp-name"
              name="name"
              placeholder="Enter your full name"
              required
              class="form-field"
            />
          </div>
          <div>
            <label for="lp-phone" class="form-label">Phone / WhatsApp Number</label>
            <input
              type="tel"
              id="lp-phone"
              name="phone"
              placeholder="+91 98765 43210"
              required
              class="form-field"
            />
          </div>
          <div>
            <label for="lp-interest" class="form-label">Trip You're Interested In</label>
            <input
              type="text"
              id="lp-interest"
              name="trip_interest"
              placeholder="e.g. Kedarnath, Goa, Kashmir..."
              class="form-field"
            />
          </div>
          <button type="submit" class="btn-orange w-full py-3 text-sm">Send Enquiry</button>
        </form>
      </div>
    </div>
  </div>
</div>
